name: Fern Docs CI

on:
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
    paths:
      - 'docs/**'
      - '.github/fern-docs.yml'
      - '.github/versions/**'
      - '.github/workflows/fern-docs-ci.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: fern-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fern-check:
    name: Fern Check
    uses: dsx-ai-factory/dsx-github-actions/.github/workflows/fern-docs-ci.yml@54d113e4894393dbf0b26aacc1c65ca4b54ee7a6
    with:
      fern_docs_path: .github/fern-docs.yml
      fern_organization: nvidia
      runner: linux-amd64-cpu4
      fern_cli_version: '5.65.2'
      docs_directory: docs
