name: Fern Docs CI

on:
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
    paths:
      - 'docs/**'
      - 'fern/**'
      - 'tools/check-docs-mdx'
      - '.github/workflows/fern-docs-ci.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: fern-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fern-check:
    name: Fern Check
    uses: dsx-ai-factory/dsx-github-actions/.github/workflows/fern-docs-ci.yml@3193ddf344c5ff4854863061ac95685728bbcfdd
    with:
      runner: linux-amd64-cpu4
      fern_cli_version: '5.65.2'
      docs_directory: docs
