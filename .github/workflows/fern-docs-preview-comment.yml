# Preview uses default-branch Fern configuration with the collected PR pages.
name: "Fern Docs Preview: Comment"

on:
  workflow_run:
    workflows: ["Fern Docs Preview: Build"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  preview:
    uses: dsx-ai-factory/dsx-github-actions/.github/workflows/fern-docs-preview-comment.yml@5a04d9e41ad79c4ff66ca27611c2ba0cd27ba123
    with:
      runner: linux-amd64-cpu4
      fern_cli_version: '5.65.2'
      docs_directory: docs
    secrets:
      FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}
