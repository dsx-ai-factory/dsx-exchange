# Preview uses default-branch Fern configuration with the collected PR pages.
name: "Fern Docs Preview: Comment"

on:
  workflow_run:
    workflows: ["Fern Docs Preview: Build"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  preview:
    uses: dsx-ai-factory/dsx-github-actions/.github/workflows/fern-docs-preview-comment.yml@ff256deef9bbbfb595f33e6e6e914d341b27cf2d
    with:
      fern_docs_path: .github/fern-docs.yml
      fern_organization: nvidia
      runner: linux-amd64-cpu4
      fern_cli_version: '5.65.2'
      docs_directory: docs
    secrets:
      FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}
