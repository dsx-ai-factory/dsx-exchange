# Copy-pr-bot vets PR pages before this workflow collects them without secrets.
name: "Fern Docs Preview: Build"

on:
  push:
    branches:
      - "pull-request/[0-9]+"
    paths:
      - 'docs/**'
      - '.github/fern-docs.yml'
      - '.github/versions/**'
      - '.github/workflows/fern-docs-preview*.yml'

permissions:
  contents: read

concurrency:
  group: fern-preview-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    uses: dsx-ai-factory/dsx-github-actions/.github/workflows/fern-docs-preview-build.yml@cc0921a925ede254a0dac4c00ad1d5d1ac1eb9f5
    with:
      runner: linux-amd64-cpu4
      docs_directory: docs
