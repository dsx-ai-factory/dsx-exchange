#
# Stable and RC tags update the documentation site. The shared publisher queues
# releases and owns concurrency, so this caller must not set concurrency.
name: Publish Fern Docs

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable or RC tag to publish, such as v0.1.0-rc.1. Leave empty to use the latest release."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    name: Publish
    uses: dsx-ai-factory/dsx-github-actions/.github/workflows/publish-fern-docs.yml@ad7d944201c5761ee0e848c61b7c8d8b65a67957
    with:
      runner: linux-amd64-cpu4
      fern_cli_version: '5.65.2'
      tag: ${{ inputs.tag || '' }}
      navigation_file: ''
      docs_directory: docs
      register_versions: false
      publish_rc: true
      native_checks: false
      publish: true
    secrets:
      FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}
